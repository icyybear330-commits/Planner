<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Daily Planner</title>
<meta name="theme-color" content="#0a0214"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Planner">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
:root{--bg:#0a0214;--card:#202020;--ink:#ffffff;--mut:#a095b4;--line:#352c40;--c0:#5b4585;--c1:#9b6fe0;--c2:#c58bff;--acc:#c58bff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Lato',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}h2{font-size:17px;margin:20px 0 8px}
.mut{color:var(--mut);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 4px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--acc);color:#fff;border:0;border-radius:30px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border:0}.task .t{flex:1;min-width:0}.task .t b{font-weight:600;display:block;overflow-wrap:anywhere}
.task.done .t b{text-decoration:line-through;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex:none;color:#fff;font-size:14px;line-height:1}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--c2);transition:width .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:20px;padding:5px 12px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--mut);font-size:12px}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.cal .d.td{border-color:var(--acc);font-weight:800}.cal .d.sel{background:var(--ink);color:var(--bg)}.cal .d.e{visibility:hidden}
.dots{display:flex;gap:2px;min-height:8px}.dots .dot{width:6px;height:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row button.s{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:8px;padding:4px 12px;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select{width:100%;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
.sug{padding:8px 0;border-bottom:1px solid var(--line)}.sug:last-child{border:0}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:6px}.lg span{display:flex;align-items:center;gap:5px}
svg{max-width:100%;height:auto}svg text{fill:var(--mut);font:11px 'Lato',sans-serif}
body{background:radial-gradient(ellipse at 50% -10%,#0e3b36 0,var(--bg) 60%) fixed,var(--bg)}
h1{text-shadow:0 0 18px rgba(93,251,232,.55)}
.card{box-shadow:0 0 0 1px rgba(93,251,232,.05),0 0 24px rgba(93,251,232,.08)}
.fab{color:#021210;box-shadow:0 0 24px rgba(93,251,232,.65)}
.btn{color:#021210;box-shadow:0 0 12px rgba(93,251,232,.4)}.btn.g{color:var(--ink);box-shadow:none}
nav{box-shadow:0 -4px 24px rgba(93,251,232,.07)}nav button{font-size:13px}
nav button.on,.chips button.on,.cal .d.sel{background:var(--c2);color:#021210;box-shadow:0 0 14px rgba(93,251,232,.6)}
.cal .d.td{box-shadow:0 0 10px rgba(93,251,232,.4)}
.bar i{box-shadow:0 0 12px var(--c2)}
.dot{box-shadow:0 0 7px rgba(93,251,232,.6)}
.chk{color:#021210;box-shadow:0 0 6px rgba(93,251,232,.25)}
.task.done .chk{box-shadow:0 0 10px rgba(93,251,232,.7)}
svg{filter:drop-shadow(0 0 4px rgba(93,251,232,.35))}
.q{border-left:2px solid var(--c2);font-style:italic;font-size:16px;text-shadow:0 0 12px rgba(93,251,232,.3)}
.q .mut{font-style:normal;text-shadow:none}
.row input{flex:1}
body{background:radial-gradient(ellipse at 50% 28%,#1d0636 0,var(--bg) 65%) fixed,var(--bg);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1{font-weight:900;letter-spacing:-1px;text-shadow:none}
.card{border-radius:22px;box-shadow:none}
.fab{color:#12001f;font-weight:900;box-shadow:0 6px 24px rgba(197,139,255,.4)}
.btn{color:#12001f;box-shadow:none}.btn.g{color:var(--ink)}
nav{background:rgba(32,32,32,.94);box-shadow:none}nav button{font-weight:700}
nav button.on,.chips button.on,.cal .d.sel{background:var(--c2);color:#12001f;box-shadow:none}
.cal .d.td{border-color:var(--c2);box-shadow:none}
.dot,.chk,.task.done .chk{box-shadow:none}.chk{color:#12001f}
svg{filter:drop-shadow(0 0 7px rgba(197,139,255,.3))}
.q{border-left:3px solid var(--c2);text-shadow:none}
input,select{font-size:16px}
.gw{position:relative;max-width:300px;margin:8px auto 0}.gw svg{width:100%;display:block}
.gv{position:absolute;left:0;right:0;bottom:0;text-align:center}.gv b{display:block;font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1}.gv span{color:var(--mut);font-size:13px}
</style></head><body>
<main id="app"></main>
<button class="fab" id="add">+ New task</button>
<nav id="nav"></nav>
<dialog id="dlg"><form method="dialog" id="f" onsubmit="return false">
<h2 style="margin-top:0">New task</h2>
<label>What needs doing?</label><input id="ti" required maxlength="80">
<label>Category</label><select id="ca"><option value="2">Elite – the 10% that drives 90% of results</option><option value="1">Medium importance</option><option value="0">Basic maintenance</option></select>
<label>Date (start date for repeating tasks)</label><input type="date" id="da" required>
<label>Time (optional)</label><input type="time" id="tm">
<label>Repeat</label><select id="re"><option value="none">Doesn't repeat</option><option value="daily">Every day</option><option value="alt">Every alternate day</option><option value="weekly">Every week (same weekday)</option><option value="monthly">Every month (same date)</option></select>
<div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn g" id="cx">Cancel</button><button type="button" class="btn" id="sv">Save task</button></div>
</form></dialog>
<script>
var CATS=[{n:'Basic',c:'var(--c0)'},{n:'Medium',c:'var(--c1)'},{n:'Elite',c:'var(--c2)'}];
var REP={none:'Once',daily:'Daily',alt:'Alternate days',weekly:'Weekly',monthly:'Monthly'};
var S={tasks:[],done:{},lists:null},delP=null,delL=false,LID=1,nl=false,view='today',filt=-1,sel=ymd(new Date()),cm=new Date();cm.setDate(1);
try{var raw=localStorage.getItem('planner1');if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.lists)S.lists=[{id:1,name:'Grocery',items:[]},{id:2,name:'Errands',items:[]}];if(!S.done)S.done={};
function save(){try{localStorage.setItem('planner1',JSON.stringify(S))}catch(e){}try{pushSync()}catch(e){}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])}
function dn(s){var a=s.split('-');return Math.round(Date.UTC(+a[0],a[1]-1,+a[2])/864e5)}
function occ(t,d){var df=dn(d)-dn(t.date);if(df<0)return false;
 if(t.rep=='none')return df==0;if(t.rep=='daily')return true;if(t.rep=='alt')return df%2==0;
 if(t.rep=='weekly')return df%7==0;if(t.rep=='monthly')return pd(d).getDate()==pd(t.date).getDate();return false}
function on(d){return S.tasks.filter(function(t){return occ(t,d)}).sort(function(a,b){return b.cat-a.cat||(a.time||'99').localeCompare(b.time||'99')})}
function isDone(t,d){return S.done[t.id+'|'+d]!=null}
function tog(id,d){var k=id+'|'+d;if(S.done[k]!=null)delete S.done[k];else S.done[k]=new Date().getHours();save();render()}
function del(id){if(delP!=id){delP=id;render();return}delP=null;S.tasks=S.tasks.filter(function(t){return t.id!=id});
 Object.keys(S.done).forEach(function(k){if(k.split('|')[0]==id)delete S.done[k]});save();render()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function trow(t,d){var dn_=isDone(t,d),c=CATS[t.cat].c;
 return '<div class="task'+(dn_?' done':'')+'"><button class="chk" style="'+(dn_?'background:'+c+';border-color:'+c:'border-color:'+c)+'" onclick="tog('+t.id+',\''+d+'\')">'+(dn_?'✓':'')+'</button><div class="t"><b>'+esc(t.title)+'</b><span class="mut">'+CATS[t.cat].n+(t.time?' · '+t.time:'')+(t.rep!='none'?' · '+REP[t.rep]:'')+'</span></div></div>'}
function today(){var d=ymd(new Date()),L=on(d),n=L.filter(function(t){return isDone(t,d)}).length,p=L.length?Math.round(n/L.length*100):0;
 var h='<h1>'+new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})+'</h1><div class="mut">Do your Elite tasks first, while your energy is highest.</div>'+quote()+pushCard();
 h+='<div class="card" style="margin-top:14px"><div class="row"><b>Today\'s progress</b><span>'+n+'/'+L.length+' · '+p+'%</span></div><div class="gw"><svg viewBox="0 0 200 110"><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="#3a2a55" stroke-width="13" stroke-linecap="round"/><path d="M20 100A80 80 0 0 1 180 100" fill="none" style="stroke:var(--c2)" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+(p*2.513)+' 400"/></svg><div class="gv"><b>'+p+'%</b><span>'+n+' of '+L.length+' done</span></div></div></div>';
 if(!L.length)h+='<div class="card mut">Nothing planned for today. Tap “+ New task” to add your first Elite task.</div>';
 [2,1,0].forEach(function(c){var g=L.filter(function(t){return t.cat==c});if(!g.length)return;
  h+='<div class="card"><div class="row"><b><span class="dot" style="background:'+CATS[c].c+'"></span> '+CATS[c].n+'</b><span class="mut">'+g.length+'</span></div>'+g.map(function(t){return trow(t,d)}).join('')+'</div>'});
 return h}
function tasks(){var h='<h1>To-do list</h1><div class="chips">'+['All'].concat(CATS.map(function(c){return c.n})).map(function(n,i){return '<button class="'+(filt==i-1?'on':'')+'" onclick="filt='+(i-1)+';render()">'+n+'</button>'}).join('')+'</div>';
 var L=S.tasks.filter(function(t){return filt<0||t.cat==filt}).sort(function(a,b){return b.cat-a.cat});
 if(!L.length)return h+'<div class="card mut">No tasks yet. Add one with “+ New task”.</div>';
 return h+'<div class="card">'+L.map(function(t){return '<div class="task"><span class="dot" style="background:'+CATS[t.cat].c+'"></span><div class="t"><b>'+esc(t.title)+'</b><span class="mut">'+CATS[t.cat].n+' · starts '+t.date+(t.time?' at '+t.time:'')+' · '+REP[t.rep]+'</span></div><button class="x" title="Delete" onclick="del('+t.id+')">'+(delP==t.id?'Sure?':'✕')+'</button></div>'}).join('')+'</div>'}
function calv(){var y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),t0=ymd(new Date());
 var h='<h1>Calendar</h1><div class="row" style="margin:10px 0"><button class="s btn g" onclick="cm.setMonth(cm.getMonth()-1);render()">‹</button><b>'+cm.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</b><button class="s btn g" onclick="cm.setMonth(cm.getMonth()+1);render()">›</button></div><div class="cal">';
 'SMTWTFS'.split('').forEach(function(x){h+='<div class="h">'+x+'</div>'});
 for(var i=0;i<first;i++)h+='<div class="d e"></div>';
 for(var d=1;d<=dim;d++){var k=ymd(new Date(y,m,d)),cs=[];on(k).forEach(function(t){if(cs.indexOf(t.cat)<0)cs.push(t.cat)});
  h+='<button class="d'+(k==t0?' td':'')+(k==sel?' sel':'')+'" onclick="sel=\''+k+'\';render()"><span>'+d+'</span><span class="dots">'+cs.sort().map(function(c){return '<i class="dot" style="background:'+CATS[c].c+'"></i>'}).join('')+'</span></button>'}
 h+='</div><h2>'+pd(sel).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})+'</h2>';
 var L=on(sel);h+=L.length?'<div class="card">'+L.map(function(t){return trow(t,sel)}).join('')+'</div>':'<div class="card mut">Nothing scheduled for this day.</div>';
 return h}
function stats(){var cnt=[0,0,0],hrs=new Array(24).fill(0),tot=0;
 Object.keys(S.done).forEach(function(k){var id=k.split('|')[0],t=S.tasks.find(function(x){return x.id==id});if(!t)return;cnt[t.cat]++;hrs[S.done[k]]++;tot++});
 var days=[];for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=ymd(d),L=on(k),n=L.filter(function(t){return isDone(t,k)}).length;days.push({d:d,p:L.length?Math.round(n/L.length*100):null})}
 return{cnt:cnt,hrs:hrs,tot:tot,days:days}}
function pie(cnt,tot){if(!tot)return '<div class="mut">Complete some tasks to see your split.</div>';
 var r=70,cx=90,cy=90,a=-Math.PI/2,s='<svg viewBox="0 0 180 180" width="180">';
 cnt.forEach(function(v,i){if(!v)return;if(v==tot){s+='<circle cx="90" cy="90" r="70" fill="'+CATS[i].c+'"/>';return}
  var b=a+v/tot*2*Math.PI,l=b-a>Math.PI?1:0;
  s+='<path d="M'+cx+' '+cy+' L'+(cx+r*Math.cos(a))+' '+(cy+r*Math.sin(a))+' A'+r+' '+r+' 0 '+l+' 1 '+(cx+r*Math.cos(b))+' '+(cy+r*Math.sin(b))+' Z" fill="'+CATS[i].c+'" stroke="var(--card)" stroke-width="2"/>';a=b});
 return '<div class="row" style="justify-content:space-around;flex-wrap:wrap">'+s+'</svg><div class="lg" style="flex-direction:column">'+CATS.map(function(c,i){return '<span><i class="dot" style="background:'+c.c+'"></i>'+c.n+': '+cnt[i]+' ('+Math.round(cnt[i]/tot*100)+'%)</span>'}).join('')+'</div></div>'}
function hbars(h){var mx=Math.max.apply(null,h);if(!mx)return '<div class="mut">Your most productive hours will appear once you tick off tasks.</div>';
 var s='<svg viewBox="0 0 480 130" width="100%">';h.forEach(function(v,i){var ht=v/mx*90;s+='<rect x="'+(i*20+4)+'" y="'+(100-ht)+'" width="14" height="'+ht+'" rx="3" fill="var(--c2)" opacity="'+(v==mx?1:.45)+'"/>';if(i%3==0)s+='<text x="'+(i*20+11)+'" y="118" text-anchor="middle">'+i+'h</text>'});
 return s+'</svg>'}
function line(D){var pts=D.filter(function(x){return x.p!=null});if(pts.length<2)return '<div class="mut">Your progress line needs at least two days with planned tasks.</div>';
 var s='<svg viewBox="0 0 480 160" width="100%">',W=440,x0=30;[0,50,100].forEach(function(g){var y=130-g*1.1;s+='<line x1="'+x0+'" x2="470" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="24" y="'+(y+4)+'" text-anchor="end">'+g+'%</text>'});
 var pp=[];D.forEach(function(x,i){if(x.p==null)return;var X=x0+i*W/13,Y=130-x.p*1.1;pp.push(X+','+Y);if(i%3==0||i==13)s+='<text x="'+X+'" y="150" text-anchor="middle">'+x.d.getDate()+'/'+(x.d.getMonth()+1)+'</text>'});
 s+='<polyline points="'+pp.join(' ')+'" fill="none" stroke="var(--c2)" stroke-width="2.5" stroke-linejoin="round"/>';
 pp.forEach(function(p){var q=p.split(',');s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3.5" fill="var(--c2)"/>'});return s+'</svg>'}
function tips(st){var T=[],c=st.cnt,tot=st.tot;
 if(!S.tasks.length)T.push('Start by adding 1–3 Elite tasks for tomorrow: the work that moves your biggest goal.');
 if(tot>4){var ep=c[2]/tot;
  if(ep<.3)T.push('Only '+Math.round(ep*100)+'% of your finished work is Elite. Schedule one Elite task first thing each day, before Basic chores.');
  else T.push('Great focus: '+Math.round(ep*100)+'% of your completions are Elite. Protect that time.');
  if(c[0]>c[2])T.push('You complete more Basic than Elite tasks. Try batching Basic chores into one 30-minute slot.');
  var mx=Math.max.apply(null,st.hrs),h=st.hrs.indexOf(mx);T.push('Your peak hour is around '+h+':00. Put your hardest Elite task there.')}
 var last=st.days.filter(function(x){return x.p!=null}).slice(-3);
 if(last.length==3&&last.every(function(x){return x.p<50}))T.push('Your last 3 days were under 50%. Try fewer tasks per day (max 3 Elite + a few others).');
 T.push('Keep Elite tasks to 3 a day at most; more than that and nothing is truly “elite”.');
 T.push('Use repeats for habits (daily/alternate days) and leave one-off tasks as “Once” to keep the list clean.');
 T.push('Do a 5-minute review each evening: tick what’s done and plan tomorrow’s Elite task.');
 return T}
function ins(){var st=stats();return '<h1>Insights</h1><div class="mut">'+st.tot+' tasks completed in total</div>'+
 '<div class="card"><b>Where your time goes</b><div style="margin-top:8px">'+pie(st.cnt,st.tot)+'</div></div>'+
 '<div class="card"><b>When you’re most productive</b><div class="mut">Completions by hour of day</div>'+hbars(st.hrs)+'</div>'+
 '<div class="card"><b>Progress, last 14 days</b><div class="mut">% of planned tasks completed</div>'+line(st.days)+'</div>'+
 '<div class="card"><b>Suggestions</b>'+tips(st).map(function(t){return '<div class="sug">'+t+'</div>'}).join('')+'</div>'}
var Q=[["The impediment to action advances action. What stands in the way becomes the way.","Marcus Aurelius"],["Waste no more time arguing about what a good man should be. Be one.","Marcus Aurelius"],["If it is not right, do not do it. If it is not true, do not say it.","Marcus Aurelius"],["You have a right to your actions, but never to your actions’ fruits.","Krishna, Bhagavad Gita"],["Set thy heart upon thy work, but never on its reward.","Krishna, Bhagavad Gita"],["The mind is restless, but it can be trained through practice and detachment.","Krishna, Bhagavad Gita"],["Victory belongs to the most persevering.","Napoleon Bonaparte (attributed)"],["Take time to deliberate, but when the time for action arrives, stop thinking and go in.","Napoleon Bonaparte (attributed)"],["Imagination rules the world.","Napoleon Bonaparte (attributed)"],["It is not that we have a short time to live, but that we waste much of it.","Seneca"],["We suffer more often in imagination than in reality.","Seneca"],["No man is free who is not master of himself.","Epictetus"],["A journey of a thousand miles begins with a single step.","Lao Tzu"],["He who has a why to live can bear almost any how.","Friedrich Nietzsche"]];
var QI=dn(ymd(new Date()))%Q.length;
function quote(){var q=Q[QI%Q.length];return '<div class="card q" style="margin-top:14px"><div>“'+q[0]+'”</div><div class="row" style="margin-top:8px"><span class="mut">— '+q[1]+'</span><button class="s" onclick="QI++;render()">Next quote</button></div></div>'}
function cur(){return S.lists.find(function(x){return x.id==LID})}
function el(i){return document.getElementById(i)}
function addItem(){var L=cur(),v=el('ni').value;if(!L)return;v.split(',').forEach(function(s,k){s=s.trim();if(s)L.items.push({id:Date.now()+k,t:s,d:false})});save();render();var e=el('ni');if(e)e.focus()}
function tgItem(id){var i=cur().items.find(function(x){return x.id==id});i.d=!i.d;save();render()}

 var h='<h1>Lists</h1><div class="mut">Grocery, errands, anything you need to pick up. Add several items at once with commas.</div><div class="chips">'+Ls.map(function(x){return '<button class="'+(x.id==LID?'on':'')+'" onclick="LID='+x.id+';delL=false;render()">'+esc(x.name)+'</button>'}).join('')+'<button onclick="nl=!nl;render()">+ New list</button></div>';

 h+=its.length?its.map(function(i){return '<div class="task'+(i.d?' done':'')+'"><button class="chk" style="border-color:var(--c2);'+(i.d?'background:var(--c2)':'')+'" onclick="tgItem('+i.id+')">'+(i.d?'✓':'')+'</button><div class="t"><b>'+esc(i.t)+'</b></div><button class="x" onclick="rmItem('+i.id+')">✕</button></div>'}).join(''):'<div class="mut" style="padding:12px 0">This list is empty.</div>';

 return h}
